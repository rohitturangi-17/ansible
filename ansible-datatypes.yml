---
- name: ansible data
  hosts: localhost
  vars:
    COURSE: "devops is a art"
    DURATION: 120
    LIST:
    - AWS
    - AZURE
    - GCP
  tasks:
    - name: install my COURSE
      ansible.builtin.debug:
        msg: "{{ COURSE }} and my time is {{ DURATION }} , then content is {{ LIST }}"
        when: DURATION > 100

    - name: install my new COURSE
      ansible.builtin.debug:
       msg: "my time is {{DURATION}}" 
       when: DURATION == 120  
